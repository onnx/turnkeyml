[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "turnkeyml"
dynamic = ["version"]
description = "TurnkeyML Tools and Models"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ email = "turnkeyml@amd.com" }]
requires-python = ">=3.11, <3.12"
dependencies = [
    "invoke>=2.0.0",
    "onnx>=1.11.0,<1.18.0",
    "onnxmltools==1.10.0",
    "torch>=1.12.1",
    "pyyaml>=5.4",
    "typeguard>=2.3.13",
    "packaging>=20.9",
    # Necessary until upstream packages account for the breaking
    # change to numpy
    "numpy<2.0.0",
    "pandas>=1.5.3",
    "fasteners",
    "GitPython>=3.1.40",
    "psutil>=6.1.1",
    "wmi",
    "pytz",
    "zstandard",
    "matplotlib",
    "tabulate",
    "onnxconverter-common",
    # huggingface-hub==0.31.0 introduces a new transfer protocol that was causing us issues
    "huggingface-hub==0.30.2",
    # Conditional dependencies for ONNXRuntime backends
    "onnxruntime >=1.10.1,<1.22.0;platform_system=='Linux'",
    "onnxruntime-directml >=1.19.0,<1.22.0;platform_system=='Windows'",
]

[project.scripts]
turnkey = "turnkeyml.cli.cli:main"

[tool.setuptools]
include-package-data = true
package-dir = { "" = "src", turnkeyml_models = "models" }
packages = [
    "turnkeyml",
    "turnkeyml.tools",
    "turnkeyml.tools.discovery",
    "turnkeyml.sequence",
    "turnkeyml.cli",
    "turnkeyml.common",
    "turnkeyml_models",
    "turnkeyml_models.graph_convolutions",
    "turnkeyml_models.selftest",
    "turnkeyml_models.timm",
    "turnkeyml_models.torch_hub",
    "turnkeyml_models.torchvision",
    "turnkeyml_models.transformers",
]
package-data = { turnkeyml_models = ["requirements.txt", "readme.md"] }

[tool.setuptools.dynamic]
version = { attr = "turnkeyml.version.__version__" }

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]