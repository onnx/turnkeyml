name: Publish Python distributions to PyPI

on:
  push:
    branches: ["main", "canary", "refresh"]
    tags:
      - v*
      - RC*
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  build:
    name: Build and test Python distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install pypa/build
        run: >-
          python -m pip install build
      - name: Build a binary wheel and a source tarball
        run: |
          python -m build --sdist --wheel --outdir dist/ .
          version=$(python -c "import runpy; print(runpy.run_path('src/turnkeyml/version.py')['__version__'])")
          echo "VERSION=$version" >> $GITHUB_ENV
      - name: Test wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "dist/turnkeyml-${VERSION}-py3-none-any.whl"
          models=$(turnkey models-location --quiet)
          turnkey -i "$models/selftest/linear.py" discover export-pytorch
      - name: Upload distributions
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/RC')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/
      - name: Publish distribution package to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-test-pypi:
    name: Publish to TestPyPI
    if: startsWith(github.ref, 'refs/tags/RC')
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/
      - name: Publish distribution package to Test PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
