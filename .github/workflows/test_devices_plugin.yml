# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Lint and Test Devices Plugin

on:
  push:
    branches: ["main"]
    paths:
    - plugins/devices/src/turnkeyml_plugin_devices/common/**
    - plugins/devices/src/turnkeyml_plugin_devices/onnxrt/**
    - plugins/devices/src/turnkeyml_plugin_devices/torchrt/**
    - plugins/devices/src/turnkeyml_plugin_devices/tensorrt/**
    - plugins/devices/setup.py
    - plugins/devices/test/**
    - src/turnkeyml/**
    - pyproject.toml
    - .github/workflows/test_devices_plugin.yml
  pull_request:
    branches: ["main"]
    paths:
    - plugins/devices/src/turnkeyml_plugin_devices/common/**
    - plugins/devices/src/turnkeyml_plugin_devices/onnxrt/**
    - plugins/devices/src/turnkeyml_plugin_devices/torchrt/**
    - plugins/devices/src/turnkeyml_plugin_devices/tensorrt/**
    - plugins/devices/setup.py
    - plugins/devices/test/**
    - src/turnkeyml/**
    - pyproject.toml
    - .github/workflows/test_devices_plugin.yml

permissions:
  contents: read

jobs:
  build-devices-plugin:
    env:
      TURNKEY_TRACEBACK: True
    strategy:
      matrix:
        python-version: ["3.11"]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Miniconda with 64-bit Python
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          miniconda-version: "latest"
          activate-environment: tkml
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        shell: bash -el {0}
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.15.7 pytest
          python -m pip install -e . -e plugins/devices "transformers<4.46.3" "tokenizers<0.20.4" timm
          python -m pip check
      - name: Lint and format with Ruff
        shell: bash -el {0}
        run: |
          ruff check plugins/devices/src
          ruff format --check plugins/devices/src
      - name: Test with unittest
        shell: bash -el {0}
        run: |
          python plugins/devices/test/unit.py
          python plugins/devices/test/benchmark.py
      